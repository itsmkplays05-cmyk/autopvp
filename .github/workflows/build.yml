name: Build AutoPvP
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: unzip -q "$(ls -t *.zip | head -1)" -d work
      - name: Build
        working-directory: work/AutoPvP-Client
        run: |
          set +e
          gradle build --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo '### Compile errors' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A2 "error:" build.log | sed 's#.*/com/macepvp/##' | head -120 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: AutoPvP_jar
          path: work/AutoPvP-Client/build/libs/*.jar
