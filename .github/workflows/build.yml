name: Build AutoPvP
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: unzip -q "$(ls *.zip | head -1)" -d work
      - run: gradle build --no-daemon
        working-directory: work/AutoPvP-Client
      - uses: actions/upload-artifact@v4
        with:
          name: AutoPvP_jar
          path: work/AutoPvP-Client/build/libs/*.jar
